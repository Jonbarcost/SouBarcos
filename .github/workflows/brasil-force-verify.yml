name: Verify Brasil Force (isolated)
on:
  push:
    branches: ["codex/brasilforce-production-audit"]
    paths: ["brasil-force-app/**", ".github/workflows/brasil-force-verify.yml"]
  pull_request:
    paths: ["brasil-force-app/**", ".github/workflows/brasil-force-verify.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: brasil-force-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: brasil-force-app
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SITE_URL: http://localhost:3100
      AUTH_REGISTRATION_ENABLED: "false"
      AUTH_GOOGLE_ENABLED: "false"
      AUTH_APPLE_ENABLED: "false"
      SHIPPING_ENABLED: "false"
      SHIPPING_PRODUCTION_ENABLED: "false"
      BF_AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: brasil-force-app/.nvmrc
          cache: npm
          cache-dependency-path: brasil-force-app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run test:http
