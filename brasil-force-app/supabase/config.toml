# Local acceptance stack only. Never link to the shared remote project.
project_id = "bf-first-seller"
[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 55322
shadow_port = 55320
major_version = 17
[db.seed]
enabled = false
[db.pooler]
enabled = false
[realtime]
enabled = false
[studio]
enabled = false
[local_smtp]
enabled = true
port = 55324
[storage]
enabled = true
file_size_limit = "5MiB"
[storage.vector]
enabled = false
[analytics]
enabled = false
[edge_runtime]
enabled = false
[auth]
enabled = true
site_url = "http://127.0.0.1:3200"
additional_redirect_urls = ["http://127.0.0.1:3200/auth/callback"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12
[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "1s"
[auth.rate_limit]
email_sent = 100
sign_in_sign_ups = 100
token_verifications = 100
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
