<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Promoções — SouBarcos</title>
<meta name="description" content="Ofertas e promoções exclusivas selecionadas pelo SouBarcos, organizadas por categoria.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .compare{
    padding: 64px 0;
    border-bottom: 1px solid var(--line);
  }
  .compare-head{
    display:flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 32px;
  }
  .compare-head h2{
    font-family: 'Spectral', serif;
    font-weight: 600;
    font-size: 1.6rem;
  }
  .compare-head p{
    color: var(--slate);
    font-size: 0.95rem;
    max-width: 42ch;
  }
  .products-grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 18px;
    justify-content: center;
  }
  .product-card{
    border: 1px solid var(--line);
    border-radius: 3px;
    background: #fff;
    padding: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 10px;
  }
  .product-card img{
    width: 100%;
    height: 140px;
    object-fit: contain;
    object-position: center;
    background: var(--foam);
    border-radius: 2px;
  }
  .product-card h3{
    font-family: 'Spectral', serif;
    font-weight: 600;
    font-size: 0.98rem;
    color: var(--navy);
    line-height: 1.35;
  }
  .product-desc{
    font-size: 0.85rem;
    color: var(--slate);
    line-height: 1.45;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .product-price{
    display: flex;
    align-items: baseline;
    gap: 1px;
    font-variant-numeric: tabular-nums;
  }
  .price-currency{
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    font-size: 0.78rem;
    color: #96631a;
    margin-right: 3px;
  }
  .price-whole{
    font-family: 'Spectral', serif;
    font-weight: 700;
    font-size: 1.4rem;
    color: #7a4f0f;
    line-height: 1;
  }
  .price-decimal{
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    font-size: 0.82rem;
    color: #96631a;
    align-self: flex-start;
    margin-top: 2px;
  }
  .price-fallback{
    font-family: 'Space Mono', monospace;
    font-size: 0.85rem;
    color: var(--slate-light);
  }
  .product-store{
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--slate-light);
  }
  .product-link{
    margin-top: auto;
    display: inline-block;
    text-align: center;
    font-size: 0.85rem;
    font-weight: 600;
    color: #fff;
    background: var(--navy);
    padding: 9px 14px;
    border-radius: 3px;
    text-decoration: none;
  }
  .product-link:hover{ background: var(--ocean); }
  .compare-empty{
    color: var(--slate-light);
    font-size: 0.92rem;
    font-family: 'Space Mono', monospace;
  }
  .category-block{
    margin-bottom: 40px;
  }
  .category-title{
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--sand);
    border-bottom: 1px solid var(--line);
    padding-bottom: 10px;
    margin-bottom: 20px;
  }
  .category-pager{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 18px;
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
  }
  .pager-btn{
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    padding: 10px 20px;
    border-radius: 4px;
    border: 1px solid var(--navy);
    background: var(--navy);
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .pager-btn:hover:not(:disabled){
    background: var(--sand);
    border-color: var(--sand);
    color: var(--navy);
  }
  .pager-btn:active:not(:disabled){ transform: scale(0.97); }
  .pager-btn:disabled{
    opacity: 0.3;
    cursor: default;
    background: #fff;
    color: var(--slate-light);
    border-color: var(--line);
  }
  .pager-info{
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--navy);
    min-width: 110px;
    text-align: center;
  }
  .filter-pill{
    display:flex;
    flex-direction: column;
    align-items:center;
    gap: 6px;
    font-family: 'Space Mono', monospace;
    font-size: 0.66rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 12px 16px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--slate);
    cursor: pointer;
    min-width: 78px;
  }
  .filter-pill svg{
    width: 26px;
    height: 26px;
    stroke: var(--slate);
    transition: stroke 0.15s ease;
  }
  .filter-pill:hover{
    border-color: var(--sand);
  }
  .filter-pill.active{
    background: var(--navy);
    color: #fff;
    border-color: var(--navy);
  }
  .filter-pill.active svg{
    stroke: #fff;
  }

  .tabs-scroll{
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding-bottom: 4px;
  }
  .tabs-scroll::-webkit-scrollbar{ display: none; }
  .tabs-row{
    display: flex;
    gap: 8px;
    width: max-content;
    min-width: 100%;
  }
</style>
</head>
<body>

<header>
  <div class="wrap header-row">
    <div class="wordmark-group">
      <svg class="logo-mark" viewBox="0 0 100 100" aria-hidden="true">
        <g fill="none" stroke="#0B2545" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
          <path d="M12 62 L88 62 L74 78 L26 78 Z"/>
          <path d="M50 62 L50 12 L86 44 Z"/>
          <path d="M50 62 L50 12 L14 44 Z"/>
        </g>
      </svg>
      <div class="wordmark">Sou<span>Barcos</span></div>
    </div>
    <a href="index.html" class="btn-inicio">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      Início
    </a>
  </div>
</header>

<section class="compare">
  <div class="wrap">
    <div class="compare-head">
      <h2>Ofertas e promoções exclusivas</h2>
      <p>Uma seleção de ofertas escolhidas a dedo, com link direto para aproveitar.</p>
    </div>

    <div id="filterBar" style="display:none; margin-bottom:32px;">
      <input type="text" id="searchInput" placeholder="Buscar por nome do produto..." style="width:100%; max-width:420px; padding:11px 14px; border:1px solid var(--line); border-radius:3px; font-family:'Work Sans',sans-serif; font-size:0.92rem; background:#fff; margin-bottom:16px;">
      <div class="tabs-scroll">
        <div id="categoryFilters" class="tabs-row"></div>
      </div>
    </div>

    <div id="productsGrid">
      <p class="compare-empty">Carregando produtos…</p>
    </div>
  </div>
</section>

<footer>
  <div class="wrap header-row">
    <div class="wordmark">SouBarcos</div>
    <div>Projeto em construção · atualizado conforme avança</div>
  </div>
</footer>

<script>
  // pela URL real, ex: 'https://soubarcos-api.onrender.com'
  const API_URL = 'https://soubarcos.onrender.com';

  let todosProdutos = [];
  let categoriaAtiva = 'Todas';
  const PRODUTOS_POR_PAGINA = 8;
  const paginaAtualPorCategoria = {};

  async function carregarProdutos() {
    const grid = document.getElementById('productsGrid');
    try {
      const res = await fetch(API_URL + '/api/products');
      const data = await res.json();

      if (!data.resultados || data.resultados.length === 0) {
        grid.innerHTML = '<p class="compare-empty">Nenhuma oferta cadastrada ainda.</p>';
        return;
      }

      todosProdutos = data.resultados;

      // Se o link já veio com ?categoria=Nome, abre direto naquela aba
      const catDaURL = new URLSearchParams(window.location.search).get('categoria');
      if (catDaURL) categoriaAtiva = chaveCategoria(catDaURL);

      montarFiltros();
      renderizarProdutos();
      document.getElementById('filterBar').style.display = 'block';

      if (catDaURL) {
        document.querySelector('.compare').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    } catch (e) {
      grid.innerHTML = '<p class="compare-empty">Não foi possível carregar os produtos agora.</p>';
    }
  }

  // Ícones simples por palavra-chave da categoria — usa contorno fino, sem preenchimento
  const ICONES_CATEGORIA = {
    'eletrodomest': '<path d="M4 5h16v14H4z"/><path d="M4 9h16"/><circle cx="8" cy="7" r="0.6" fill="currentColor" stroke="none"/>',
    'eletronic': '<rect x="3" y="5" width="18" height="12" rx="1"/><path d="M8 21h8"/><path d="M12 17v4"/>',
    'celular': '<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',
    'telefone': '<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',
    'inform': '<rect x="3" y="4" width="18" height="12" rx="1"/><path d="M8 20h8"/><path d="M12 16v4"/>',
    'comput': '<rect x="3" y="4" width="18" height="12" rx="1"/><path d="M8 20h8"/><path d="M12 16v4"/>',
    'beleza': '<circle cx="12" cy="12" r="7.5"/><path d="M12 6.5v2"/><path d="M12 15.5v2"/><path d="M6.5 12h2"/><path d="M15.5 12h2"/><circle cx="12" cy="12" r="2.2"/>',
    'cuidado': '<circle cx="12" cy="12" r="7.5"/><path d="M12 6.5v2"/><path d="M12 15.5v2"/><path d="M6.5 12h2"/><path d="M15.5 12h2"/><circle cx="12" cy="12" r="2.2"/>',
    'pet': '<circle cx="7" cy="8" r="1.4"/><circle cx="12" cy="6" r="1.4"/><circle cx="17" cy="8" r="1.4"/><path d="M8 16c0-3 2-4 4-4s4 1 4 4c0 2-2 3-4 3s-4-1-4-3z"/>',
    'casa': '<path d="M4 11l8-6 8 6"/><path d="M6 10v10h12V10"/>',
    'cozinha': '<path d="M5 3v18"/><path d="M5 3c0 3 3 3 3 6s-3 3-3 3"/><path d="M19 3v18"/>',
    'moda': '<path d="M8 4l4 3 4-3 2 4-3 2v11H9V10L6 8z"/>',
    'esporte': '<circle cx="12" cy="12" r="8"/><path d="M4 12h16"/><path d="M12 4c3 3 3 13 0 16"/>',
    'ferramenta': '<path d="M14 7l3 3-8 8H6v-3z"/><path d="M17 4l3 3-2 2-3-3z"/>',
    'livro': '<path d="M4 5c3-1 6-1 8 0v14c-2-1-5-1-8 0z"/><path d="M20 5c-3-1-6-1-8 0v14c2-1 5-1 8 0z"/><path d="M12 5v14"/>',
    'brinquedo': '<circle cx="12" cy="8" r="3"/><path d="M7 20l2-6h6l2 6"/>',
    'automot': '<path d="M3.5 12.5l1.3-4.3A2 2 0 016.7 6.8h10.6a2 2 0 011.9 1.4l1.3 4.3"/><rect x="3" y="12.5" width="18" height="4.5" rx="1.2"/><circle cx="7.2" cy="17.5" r="1.4"/><circle cx="16.8" cy="17.5" r="1.4"/>',
    'suplement': '<rect x="2" y="9.5" width="3" height="5" rx="0.8"/><rect x="19" y="9.5" width="3" height="5" rx="0.8"/><path d="M6.5 12h11"/><rect x="6" y="10.3" width="2" height="3.4" rx="0.4"/><rect x="16" y="10.3" width="2" height="3.4" rx="0.4"/>',
    'curso': '<path d="M2 9.5l10-4 10 4-10 4z"/><path d="M6 11.3v3.6c0 1.4 2.5 2.7 6 2.7s6-1.3 6-2.7v-3.6"/><path d="M22 9.5v5.5"/>',
    'corrida': '<path d="M4 16.5c0-2 1.8-3 3.6-3l2.7-2.7 4.5 1 3.6 2.7c1 .5 1.6 1.4 1.6 2.5v.5H5c-.5 0-1-.4-1-1z"/><path d="M8 13.8l1.8 2.7"/><path d="M11.5 10.5l1.5-1.5"/>',
    'gamer': '<rect x="3" y="9" width="18" height="8" rx="4"/><path d="M8 11.3v3.4"/><path d="M6.3 13h3.4"/><circle cx="15.7" cy="12" r="1"/><circle cx="17.7" cy="14" r="1"/>',
    'game': '<rect x="3" y="9" width="18" height="8" rx="4"/><path d="M8 11.3v3.4"/><path d="M6.3 13h3.4"/><circle cx="15.7" cy="12" r="1"/><circle cx="17.7" cy="14" r="1"/>',
  };
  const ICONE_PADRAO = '<rect x="4" y="6" width="16" height="12" rx="1"/><path d="M4 10h16"/>';

  function iconeParaCategoria(nome) {
    const chave = (nome || '').toLowerCase();
    for (const termo in ICONES_CATEGORIA) {
      if (chave.includes(termo)) return ICONES_CATEGORIA[termo];
    }
    return ICONE_PADRAO;
  }

  // Normaliza nome de categoria pra evitar duplicatas por espaço/maiúscula ("Suplementos" x "suplementos ")
  function chaveCategoria(nome) {
    return (nome || 'Geral').trim().toLowerCase().replace(/\s+/g, ' ');
  }
  function nomeExibicaoCategoria(nome) {
    const limpa = (nome || 'Geral').trim().replace(/\s+/g, ' ');
    return limpa.charAt(0).toUpperCase() + limpa.slice(1);
  }

  // Deixa o preço com acabamento de e-commerce: número grande + centavos menores
  function formatarPrecoHTML(preco) {
    if (!preco) return '';
    const match = preco.trim().match(/^(R\$|US\$|\$|€)?\s*([\d.]+),(\d{2})\s*$/);
    if (match) {
      const moeda = match[1] || 'R$';
      return `<span class="price-currency">${moeda}</span><span class="price-whole">${match[2]}</span><span class="price-decimal">,${match[3]}</span>`;
    }
    return `<span class="price-fallback">${preco}</span>`;
  }

  function montarFiltros() {
    const mapaCategorias = {};
    todosProdutos.forEach((p) => {
      const chave = chaveCategoria(p.categoria);
      if (!mapaCategorias[chave]) mapaCategorias[chave] = nomeExibicaoCategoria(p.categoria);
    });

    const container = document.getElementById('categoryFilters');
    const chaves = ['Todas', ...Object.keys(mapaCategorias)];

    container.innerHTML = chaves.map((chave) => {
      const label = chave === 'Todas' ? 'Todas' : mapaCategorias[chave];
      const svgInner = chave === 'Todas'
        ? '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>'
        : iconeParaCategoria(label);
      return `
        <button class="filter-pill${chave === categoriaAtiva ? ' active' : ''}" data-categoria="${chave}">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${svgInner}</svg>
          <span>${label}</span>
        </button>
      `;
    }).join('');

    container.querySelectorAll('.filter-pill').forEach((btn) => {
      btn.addEventListener('click', () => {
        const chave = btn.dataset.categoria;

        if (chave === 'Todas') {
          // "Todas" continua na mesma aba, mostrando tudo
          categoriaAtiva = 'Todas';
          montarFiltros();
          renderizarProdutos();
          return;
        }

        // Clicar numa categoria abre ela numa ABA NOVA do navegador
        const url = new URL(window.location.href);
        url.searchParams.set('categoria', chave);
        window.open(url.toString(), '_blank');
      });
    });
  }

  function renderizarProdutos() {
    const grid = document.getElementById('productsGrid');
    const termoBusca = document.getElementById('searchInput').value.trim().toLowerCase();

    let filtrados = todosProdutos;

    if (categoriaAtiva !== 'Todas') {
      filtrados = filtrados.filter((p) => chaveCategoria(p.categoria) === categoriaAtiva);
    }

    if (termoBusca) {
      filtrados = filtrados.filter((p) => p.titulo.toLowerCase().includes(termoBusca));
    }

    if (filtrados.length === 0) {
      grid.innerHTML = '<p class="compare-empty">Nenhuma oferta encontrada com esse filtro.</p>';
      return;
    }

    // Agrupa os produtos filtrados por categoria (normalizada, evita duplicatas por espaço/maiúscula)
    const porCategoria = {};
    filtrados.forEach((p) => {
      const chave = chaveCategoria(p.categoria);
      if (!porCategoria[chave]) porCategoria[chave] = { label: nomeExibicaoCategoria(p.categoria), itens: [] };
      porCategoria[chave].itens.push(p);
    });

    grid.innerHTML = Object.keys(porCategoria).map((chave) => {
      const { label, itens: itensDaCategoria } = porCategoria[chave];
      const totalPaginas = Math.max(1, Math.ceil(itensDaCategoria.length / PRODUTOS_POR_PAGINA));

      if (!paginaAtualPorCategoria[chave]) paginaAtualPorCategoria[chave] = 1;
      if (paginaAtualPorCategoria[chave] > totalPaginas) paginaAtualPorCategoria[chave] = totalPaginas;
      const pagina = paginaAtualPorCategoria[chave];

      const inicio = (pagina - 1) * PRODUTOS_POR_PAGINA;
      const itensDaPagina = itensDaCategoria.slice(inicio, inicio + PRODUTOS_POR_PAGINA);

      return `
      <div class="category-block">
        <div class="category-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:16px; height:16px; vertical-align:-3px; margin-right:6px;">${iconeParaCategoria(label)}</svg>
          ${label}
          <span style="font-weight:400; color:var(--slate-light); font-size:0.8rem; text-transform:none; letter-spacing:0;"> — ${itensDaCategoria.length} ${itensDaCategoria.length === 1 ? 'oferta' : 'ofertas'}</span>
        </div>
        <div class="products-grid">
          ${itensDaPagina.map((p) => `
            <div class="product-card">
              ${p.imagem ? `<img src="${p.imagem}" alt="${p.titulo}">` : ''}
              <div class="product-store">${p.loja || 'Amazon'}</div>
              <h3>${p.titulo}</h3>
              ${p.descricao ? `<p class="product-desc">${p.descricao}</p>` : ''}
              <div class="product-price">${formatarPrecoHTML(p.preco)}</div>
              <a class="product-link" href="${p.link}" target="_blank" rel="noopener sponsored">Ver oferta</a>
            </div>
          `).join('')}
        </div>
        ${totalPaginas > 1 ? `
          <div class="category-pager">
            <button class="pager-btn" data-cat="${chave}" data-dir="-1" ${pagina === 1 ? 'disabled' : ''}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
              Anterior
            </button>
            <span class="pager-info">Página ${pagina} de ${totalPaginas}</span>
            <button class="pager-btn" data-cat="${chave}" data-dir="1" ${pagina === totalPaginas ? 'disabled' : ''}>
              Próxima
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
            </button>
          </div>
        ` : ''}
      </div>
    `;
    }).join('');

    grid.querySelectorAll('.pager-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const cat = btn.dataset.cat;
        const dir = parseInt(btn.dataset.dir, 10);
        paginaAtualPorCategoria[cat] = (paginaAtualPorCategoria[cat] || 1) + dir;
        renderizarProdutos();
        document.querySelector(`.category-block .category-title`);
      });
    });
  }

  document.getElementById('searchInput').addEventListener('input', () => {
    Object.keys(paginaAtualPorCategoria).forEach((c) => { paginaAtualPorCategoria[c] = 1; });
    renderizarProdutos();
  });

  carregarProdutos();
</script>
</body>
</html>
